<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cheatsheet – CSS Lab</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#6366f1">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="project.css">
</head>
<body>
<div class="protect-me"><div class="clearfix">

<header>
  <div class="wrapper"><div class="header_con">
    <div class="main_logo"><a href="index.html">CSS <span>Lab</span></a></div>
    <div class="head_info">Cheatsheet</div>
  </div></div>
</header>

<div id="nav_area"><div class="wrapper">
  <button class="hamburger" type="button" aria-label="Toggle menu">&#9776; Menu</button>
  <ul></ul>
</div></div>

<div id="main_area"><div class="wrapper">
  <section class="card">
    <h1>CSS cheatsheet</h1>
    <p>Everything from the lessons in one searchable table.</p>
    <input class="search" id="search" type="search" placeholder="Search, e.g. flex, margin, nth-child">
    <table class="cheat">
      <thead><tr><th>Concept</th><th>What it does</th><th>Example</th><th>Lesson</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</div></div>

<footer><div class="footer_btm"><div class="wrapper footer_btm_con">
  <div class="copyright">&copy; CSS Lab</div>
</div></div></footer>

<span class="back_top" title="Back to top"></span>
</div></div>

<script src="script.js"></script>
<script src="project.js"></script>
<script src="search.js"></script>
<script src="cheat-data.js"></script>
<script>
var R = window.CHEAT_ROWS;

var tbody = document.querySelector('tbody');
R.forEach(function (r) {
  var c = r.split('|');
  var tr = document.createElement('tr');
  [c[0], c[1], c[2]].forEach(function (t, n) {
    var td = document.createElement('td');
    if (n === 2) {
      var code = document.createElement('code');
      code.textContent = t;
      td.appendChild(code);
    } else {
      td.textContent = t;
    }
    tr.appendChild(td);
  });
  var td = document.createElement('td');
  var a = document.createElement('a');
  a.href = 'index.html#' + c[3];
  a.textContent = 'Open';
  td.appendChild(a);
  tr.appendChild(td);
  tbody.appendChild(tr);
});

// the site search can open this page with ?q=term already filled in
var q0 = new URLSearchParams(location.search).get('q');
if (q0) document.getElementById('search').value = q0;
document.getElementById('search').addEventListener('input', function () {
  var q = this.value.toLowerCase();
  tbody.querySelectorAll('tr').forEach(function (tr) {
    tr.hidden = tr.textContent.toLowerCase().indexOf(q) === -1;
  });
});
if (q0) document.getElementById('search').dispatchEvent(new Event('input'));
</script>
</body>
</html>

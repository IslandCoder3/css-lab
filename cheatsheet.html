<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cheatsheet – CSS Lab</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="project.css">
</head>
<body>
<div class="protect-me"><div class="clearfix">

<header>
  <div class="wrapper"><div class="header_con">
    <div class="main_logo"><a href="index.html">CSS <span>Lab</span></a></div>
    <div class="head_info">Cheatsheet</div>
  </div></div>
</header>

<div id="nav_area"><div class="wrapper">
  <button class="hamburger" type="button" aria-label="Toggle menu">&#9776; Menu</button>
  <ul></ul>
</div></div>

<div id="main_area"><div class="wrapper">
  <section class="card">
    <h1>CSS cheatsheet</h1>
    <p>Everything from the lessons in one searchable table.</p>
    <input class="search" id="search" type="search" placeholder="Search, e.g. flex, margin, nth-child">
    <table class="cheat">
      <thead><tr><th>Concept</th><th>What it does</th><th>Example</th><th>Lesson</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</div></div>

<footer><div class="footer_btm"><div class="wrapper footer_btm_con">
  <div class="copyright">&copy; CSS Lab</div>
</div></div></footer>

<span class="back_top" title="Back to top"></span>
</div></div>

<script src="script.js"></script>
<script src="project.js"></script>
<script>
var R = [
  `three ways to apply CSS|Inline, internal (<style>) or external (.css file)|<link rel="stylesheet" href="style.css">|l1`,
  `color formats|Name, hex, RGB or RGBA (a = opacity)|color: rgba(255, 0, 0, 0.5);|l2`,
  `background shorthand|Image, repeat, position and color in one|background: url('images/bg.jpg') no-repeat center top #000;|l3`,
  `font shorthand|The last value is the font-family|font: italic 700 20px Georgia, serif;|l7`,
  `width / height|px is fixed, % follows the parent|width: 47%;|l4`,
  `box-sizing reset|Template reset: include padding in the width|*, *:before, *:after { box-sizing: border-box; }|l4`,
  `padding shorthand|4 values: top right bottom left|padding: 20px 15px 0;|l5`,
  `margin / centering|Space outside; auto centers a block with a width|margin: 0 auto;|l6`,
  `inline-block boxes|Always add vertical-align: top and a width|display: inline-block; vertical-align: top; width: 32%;|l8`,
  `balanced widths|2 boxes 47%, 3 boxes 32%, 4 boxes 24%|width: 24%;|l8`,
  `display: none|Makes the element invisible|display: none;|l8`,
  `flex row|Parent lines children up and wraps them|display: flex; flex-wrap: wrap; justify-content: center; row-gap: 30px;|l9`,
  `float|Left or right; reset with none|float: left; (reset: float: none;)|l10`,
  `clearfix|Makes a parent contain its floats|.clearfix:before, .clearfix:after { content: ""; display: table; clear: both; }|l10`,
  `:before icon recipe|Relative parent, absolute pseudo-element|h2 { position: relative; padding-top: 70px; } h2:before { content: ""; position: absolute; top: 0; left: 0; right: 0; margin: 0 auto; width: 57px; height: 57px; }|l11`,
  `pseudo-classes|nth-child, first-child, last-child, hover, ::placeholder|li:nth-child(odd) { background: #eee; }|l12`,
  `position|relative = parent of absolute; absolute floats|position: absolute; top: 0; left: 0;|l13`,
  `center an absolute box|Horizontal and vertical recipes|left: 0; right: 0; margin: 0 auto; (vertical: top: 50%; transform: translateY(-50%);)|l13`,
  `z-index|Front or back, positioned elements only|z-index: 10;|l14`,
  `attribute selector|Class contains a value|[class*="mid_box"] { width: 32%; }|l15`,
  `text-transform / word-wrap|Capitalize text; break long words|text-transform: uppercase; word-wrap: break-word;|l17`,
  `border-radius|Round corners (50% = circle)|border-radius: 50%;|l17`,
  `gradients|Generated background images|background-image: linear-gradient(90deg, #f6d365, #fda085);|l16`
];

var tbody = document.querySelector('tbody');
R.forEach(function (r) {
  var c = r.split('|');
  var tr = document.createElement('tr');
  [c[0], c[1], c[2]].forEach(function (t, n) {
    var td = document.createElement('td');
    if (n === 2) {
      var code = document.createElement('code');
      code.textContent = t;
      td.appendChild(code);
    } else {
      td.textContent = t;
    }
    tr.appendChild(td);
  });
  var td = document.createElement('td');
  var a = document.createElement('a');
  a.href = 'index.html#' + c[3];
  a.textContent = 'Open';
  td.appendChild(a);
  tr.appendChild(td);
  tbody.appendChild(tr);
});

document.getElementById('search').addEventListener('input', function () {
  var q = this.value.toLowerCase();
  tbody.querySelectorAll('tr').forEach(function (tr) {
    tr.hidden = tr.textContent.toLowerCase().indexOf(q) === -1;
  });
});
</script>
</body>
</html>

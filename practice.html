<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practice – CSS Lab</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#6366f1">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="project.css">
</head>
<body>
<div class="protect-me"><div class="clearfix">

<header>
  <div class="wrapper"><div class="header_con">
    <div class="main_logo"><a href="index.html">CSS <span>Lab</span></a></div>
    <div class="head_info">Practice</div>
  </div></div>
</header>

<div id="nav_area"><div class="wrapper">
  <button class="hamburger" type="button" aria-label="Toggle menu">&#9776; Menu</button>
  <ul></ul>
</div></div>

<div id="main_area"><div class="wrapper">
  <section class="card" style="margin-bottom:20px">
    <h1>Write the CSS yourself</h1>
    <p>Type only declarations (<code>property: value;</code>), no selectors. The preview updates as you type. Press Check to test your answer.</p>
    <span class="counter" id="count"></span>
  </section>
  <div id="chal" style="max-width:1000px;margin:0 auto"></div>
</div></div>

<footer><div class="footer_btm"><div class="wrapper footer_btm_con">
  <div class="copyright">&copy; CSS Lab</div>
</div></div></footer>

<span class="back_top" title="Back to top"></span>
</div></div>

<script src="script.js"></script>
<script src="project.js"></script>
<script src="search.js"></script>
<script src="practice-data.js"></script>
<script>
var C = window.PRACTICE_DRILLS;

var solved = [];
try { solved = JSON.parse(localStorage.getItem('csslab-practice')) || []; } catch (e) {}
var list = document.getElementById('chal');
var count = document.getElementById('count');

function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt) e.textContent = txt; return e; }
function updateCount() { count.textContent = solved.length + ' / ' + C.length + ' solved'; }

C.forEach(function (d, i) {
  var card = el('section', 'card chal');
  card.id = 'drill-' + (i + 1);
  card.appendChild(el('h2', '', (i + 1) + '. ' + d.t));
  card.appendChild(el('p', '', d.task));

  var grid = el('div', 'chal_grid');
  var left = el('div');
  var prev = el('div', 'prev');
  prev.innerHTML = d.html;
  var els = prev.querySelectorAll(d.sel || '.t');
  var target = els[0];

  var ta = el('textarea');
  ta.value = d.start;
  ta.spellcheck = false;
  ta.setAttribute('autocapitalize', 'off');
  ta.setAttribute('autocorrect', 'off');
  ta.setAttribute('aria-label', 'CSS declarations');
  function live() { els.forEach(function (e) { e.style.cssText = ta.value; }); }
  ta.addEventListener('input', live);
  live();

  var res = el('ul', 'res');
  var hint = el('p', 'hint'); hint.hidden = true; hint.textContent = 'Hint: ' + d.hint;
  var sol = el('pre', 'code'); sol.hidden = true; sol.textContent = d.sol;

  var actions = el('div', 'chal_actions');
  var bCheck = el('button', 'btn primary', 'Check'); bCheck.type = 'button';
  var bHint = el('button', 'btn', 'Hint'); bHint.type = 'button';
  var bSol = el('button', 'btn', 'Show solution'); bSol.type = 'button';

  bCheck.addEventListener('click', function () {
    live();
    var cs = getComputedStyle(target), all = true;
    res.innerHTML = '';
    d.ck.forEach(function (k) {
      var ok = !!k[1](cs, target);
      if (!ok) all = false;
      res.appendChild(el('li', ok ? 'ok' : '', k[0]));
    });
    var dm = window.CSSLAB.getDrills();
    if (all) delete dm[i]; else dm[i] = { n: ((dm[i] && dm[i].n) || 0) + 1, t: d.t };
    window.CSSLAB.setDrills(dm);
    if (all) {
      card.classList.add('pass');
      if (solved.indexOf(i) < 0) {
        solved.push(i);
        try { localStorage.setItem('csslab-practice', JSON.stringify(solved)); } catch (e) {}
      }
      updateCount();
    }
  });
  bHint.addEventListener('click', function () { hint.hidden = !hint.hidden; });
  bSol.addEventListener('click', function () { sol.hidden = !sol.hidden; });

  [bCheck, bHint, bSol].forEach(function (b) { actions.appendChild(b); });
  [window.tokenBar(ta), window.cssSuggest(ta, { bare: true, focus: function () { return d.sol; } }), ta, actions, res, hint, sol].forEach(function (n) { left.appendChild(n); });
  grid.appendChild(left);
  grid.appendChild(prev);
  card.appendChild(grid);
  if (solved.indexOf(i) > -1) card.classList.add('pass');
  list.appendChild(card);
});
updateCount();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz – CSS Lab</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#6366f1">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="project.css">
</head>
<body>
<div class="protect-me"><div class="clearfix">

<header>
  <div class="wrapper"><div class="header_con">
    <div class="main_logo"><a href="index.html">CSS <span>Lab</span></a></div>
    <div class="head_info">Quiz</div>
  </div></div>
</header>

<div id="nav_area"><div class="wrapper">
  <button class="hamburger" type="button" aria-label="Toggle menu">&#9776; Menu</button>
  <ul></ul>
</div></div>

<div id="main_area"><div class="wrapper">
  <section class="card">
    <h1>Test yourself</h1>
    <p>16 questions on HTML and CSS rules from the lessons. Your best score is saved in this browser.</p>
    <div id="quiz"></div>
  </section>
</div></div>

<footer><div class="footer_btm"><div class="wrapper footer_btm_con">
  <div class="copyright">&copy; CSS Lab</div>
</div></div></footer>

<span class="back_top" title="Back to top"></span>
</div></div>

<script src="script.js"></script>
<script src="project.js"></script>
<script src="quiz-data.js"></script>
<script>
var Q = window.QUIZ_Q;

var i = 0, score = 0, roundMisses = 0, box = document.getElementById('quiz');

function show() {
  box.innerHTML = '';
  if (i >= Q.length) return finish();
  var q = Q[i];

  var h = document.createElement('h3');
  h.textContent = (i + 1) + '/' + Q.length + '. ' + q[0];
  box.appendChild(h);

  var why = document.createElement('p');
  why.className = 'why';

  var next = document.createElement('button');
  next.className = 'btn primary';
  next.textContent = i < Q.length - 1 ? 'Next' : 'See score';
  next.hidden = true;
  next.onclick = function () { i++; show(); };

  var bs = [];
  q[1].map(function (t, n) { return { t: t, ok: n === q[2] }; })
    .sort(function () { return Math.random() - 0.5; })
    .forEach(function (o) {
      var b = document.createElement('button');
      b.className = 'q_opt';
      b.textContent = o.t;
      b.onclick = function () {
        bs.forEach(function (x) { x.b.disabled = true; if (x.o.ok) x.b.classList.add('right'); });
        if (o.ok) score++;
        else {
          b.classList.add('wrong'); roundMisses++;
          var mm = window.CSSLAB.getMissed();
          mm['q' + i] = { n: ((mm['q' + i] && mm['q' + i].n) || 0) + 1 };
          window.CSSLAB.setMissed(mm);
        }
        why.textContent = q[3];
        next.hidden = false;
      };
      bs.push({ b: b, o: o });
      box.appendChild(b);
    });

  box.appendChild(why);
  box.appendChild(next);
}

function finish() {
  var best = score;
  try {
    best = Math.max(score, Number(localStorage.getItem('csslab-best')) || 0);
    localStorage.setItem('csslab-best', best);
  } catch (e) {}
  box.innerHTML = '<div class="score">' + score + ' / ' + Q.length + '</div>' +
    '<p>Best score: ' + best + ' / ' + Q.length + '</p>' +
    (roundMisses ? '<a class="btn primary" href="review.html">Review ' + roundMisses + ' mistake' + (roundMisses > 1 ? 's' : '') + '</a> ' : '') +
    '<button class="btn' + (roundMisses ? '' : ' primary') + '" id="retry">Try again</button> ' +
    '<a class="btn" href="index.html">Back to lessons</a>';
  document.getElementById('retry').onclick = function () { i = 0; score = 0; roundMisses = 0; show(); };
}

show();
</script>
</body>
</html>
